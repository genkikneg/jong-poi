name: Production availability

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-availability
  cancel-in-progress: true

jobs:
  healthcheck:
    name: Check public HTTPS health
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 15 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --output /dev/null \
            --write-out 'HTTP %{http_code} in %{time_total}s\n' \
            https://jong-poi.misoon.net/up
