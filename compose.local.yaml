name: jong-poi-local

services:
    app:
        build:
            context: .
            dockerfile: docker/local/Dockerfile
        working_dir: /var/www
        volumes:
            - .:/var/www
            - local_vendor:/var/www/vendor
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8000
            BROADCAST_CONNECTION: reverb
            REVERB_APP_ID: local
            REVERB_APP_KEY: local
            REVERB_APP_SECRET: local-secret
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            # Keep the existing local database when running the Docker stack.
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/database/database.sqlite
        command: php artisan serve --no-reload --host=0.0.0.0 --port=8000
        ports:
            - '8000:8000'

    queue:
        build:
            context: .
            dockerfile: docker/local/Dockerfile
        working_dir: /var/www
        volumes:
            - .:/var/www
            - local_vendor:/var/www/vendor
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8000
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/database/database.sqlite
        command: php artisan queue:listen --tries=1 --timeout=0

    reverb:
        build:
            context: .
            dockerfile: docker/local/Dockerfile
        working_dir: /var/www
        volumes:
            - .:/var/www
            - local_vendor:/var/www/vendor
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8000
            BROADCAST_CONNECTION: reverb
            REVERB_APP_ID: local
            REVERB_APP_KEY: local
            REVERB_APP_SECRET: local-secret
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: 8080
            DB_CONNECTION: sqlite
            DB_DATABASE: /var/www/database/database.sqlite
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - '8080:8080'

    vite:
        build:
            context: .
            dockerfile: docker/local/Dockerfile
        working_dir: /var/www
        volumes:
            - .:/var/www
            - local_node_modules:/var/www/node_modules
        environment:
            VITE_REVERB_APP_KEY: local
            VITE_REVERB_HOST: 127.0.0.1
            VITE_REVERB_PORT: 8080
            VITE_REVERB_SCHEME: http
        command: >-
            sh -c 'npm ci && printf "http://127.0.0.1:5173\\n" > public/hot &&
            trap "rm -f public/hot" EXIT INT TERM &&
            npm run dev -- --host 0.0.0.0'
        ports:
            - '5173:5173'

volumes:
    local_vendor:
    local_node_modules:
