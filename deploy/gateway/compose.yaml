name: gateway

services:
    nginx:
        image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
        restart: unless-stopped
        read_only: true
        security_opt:
            - no-new-privileges:true
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./nginx/conf.d:/etc/nginx/conf.d:ro
            - ./nginx/snippets:/etc/nginx/snippets:ro
            - /etc/letsencrypt:/etc/letsencrypt:ro
        tmpfs:
            - /var/cache/nginx:mode=0755,uid=101,gid=101
            - /var/run:mode=0755,uid=101,gid=101
        healthcheck:
            test:
                - CMD
                - nginx
                - -t
            interval: 30s
            timeout: 5s
            retries: 3
        networks:
            - proxy
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

networks:
    proxy:
        name: proxy
        external: true
