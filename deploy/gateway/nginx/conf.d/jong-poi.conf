resolver 127.0.0.11 valid=10s ipv6=off;

upstream jong_poi_web {
    zone jong_poi_web 64k;
    server jong-poi-web:8080 resolve;
}

server {
    listen 80;
    server_name jong-poi.misoon.net;

    location / {
        return 301 https://jong-poi.misoon.net$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jong-poi.misoon.net;

    ssl_certificate /etc/letsencrypt/live/jong-poi.misoon.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jong-poi.misoon.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/security.conf;

    client_max_body_size 10m;

    location / {
        proxy_pass http://jong_poi_web;
        proxy_http_version 1.1;
        proxy_set_header Host jong-poi.misoon.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host jong-poi.misoon.net;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
