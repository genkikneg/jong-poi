name: jong-poi

x-app: &app
    image: ${APP_IMAGE:?APP_IMAGE is required}
    user: '33:33'
    env_file:
        - .env
    restart: unless-stopped
    read_only: true
    security_opt:
        - no-new-privileges:true
    volumes:
        - ./storage:/var/www/storage/app
    tmpfs:
        - /var/www/bootstrap/cache:mode=0770,uid=33,gid=33
        - /var/www/storage/framework/cache:mode=0770,uid=33,gid=33
        - /var/www/storage/framework/sessions:mode=0770,uid=33,gid=33
        - /var/www/storage/framework/views:mode=0770,uid=33,gid=33
        - /var/www/storage/logs:mode=0770,uid=33,gid=33
    networks:
        - internal
    depends_on:
        db:
            condition: service_healthy
    logging:
        driver: json-file
        options:
            max-size: 10m
            max-file: '3'

services:
    app:
        <<: *app
        stop_grace_period: 30s

    queue:
        <<: *app
        command:
            - php
            - artisan
            - queue:work
            - --sleep=3
            - --tries=3
            - --timeout=90
            - --max-time=3600
        healthcheck:
            disable: true
        stop_grace_period: 100s

    scheduler:
        <<: *app
        command:
            - php
            - artisan
            - schedule:work
        healthcheck:
            disable: true
        stop_grace_period: 30s

    reverb:
        <<: *app
        command:
            - php
            - artisan
            - reverb:start
            - --host=0.0.0.0
            - --port=8080
        expose:
            - '8080'
        healthcheck:
            disable: true
        networks:
            - internal
            - proxy
        stop_grace_period: 30s

    jong-poi-web:
        image: ${WEB_IMAGE:?WEB_IMAGE is required}
        restart: unless-stopped
        read_only: true
        security_opt:
            - no-new-privileges:true
        volumes:
            - ./storage/public:/var/www/storage/app/public:ro
        tmpfs:
            - /var/cache/nginx:mode=0755,uid=101,gid=101
            - /var/run:mode=0755,uid=101,gid=101
        depends_on:
            app:
                condition: service_healthy
        networks:
            - internal
            - proxy
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

    db:
        image: ${MYSQL_IMAGE:-mysql:8.0.45}
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
            MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
            MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
            TZ: Asia/Tokyo
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        volumes:
            - ./database:/var/lib/mysql
        healthcheck:
            test:
                - CMD-SHELL
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        networks:
            - internal
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'

networks:
    internal:
    proxy:
        name: ${PROXY_NETWORK:-proxy}
        external: true
